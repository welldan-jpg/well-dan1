<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>教師業務判定ツール</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #F5F3EE;
      --surface: #FFFFFF;
      --border: #E0DDD6;
      --text: #1A1816;
      --muted: #7A7570;
      --accent: #2B2826;
      --green-bg: #EAF3DE;
      --green-text: #27500A;
      --green-border: #97C459;
      --amber-bg: #FEF3E2;
      --amber-text: #633806;
      --amber-border: #EF9F27;
      --red-bg: #FAECE7;
      --red-text: #4A1B0C;
      --red-border: #D85A30;
      --gray-bg: #F0EDE8;
      --gray-text: #5F5E5A;
      --gray-border: #B4B2A9;
    }

    body {
      font-family: 'Noto Sans JP', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 3rem 1.25rem 5rem;
    }

    .header {
      text-align: center;
      margin-bottom: 3rem;
    }

    .header-label {
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.12em;
      color: var(--muted);
      text-transform: uppercase;
      margin-bottom: 0.75rem;
    }

    h1 {
      font-size: clamp(1.5rem, 4vw, 2.25rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.2;
      color: var(--text);
      margin-bottom: 0.75rem;
    }

    .header-sub {
      font-size: 14px;
      color: var(--muted);
      line-height: 1.7;
      max-width: 420px;
      margin: 0 auto;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 2rem;
      width: 100%;
      max-width: 560px;
    }

    .input-label {
      font-size: 12px;
      font-weight: 500;
      color: var(--muted);
      letter-spacing: 0.05em;
      margin-bottom: 0.5rem;
      display: block;
    }

    textarea {
      width: 100%;
      min-height: 100px;
      resize: vertical;
      font-family: 'Noto Sans JP', sans-serif;
      font-size: 15px;
      line-height: 1.7;
      color: var(--text);
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 14px;
      outline: none;
      transition: border-color 0.2s;
    }

    textarea:focus {
      border-color: #888;
    }

    textarea::placeholder {
      color: var(--gray-border);
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      margin-top: 0.75rem;
      padding: 13px;
      font-family: 'Noto Sans JP', sans-serif;
      font-size: 15px;
      font-weight: 500;
      color: var(--surface);
      background: var(--accent);
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
    }

    .btn:hover { opacity: 0.85; }
    .btn:active { transform: scale(0.98); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .hint {
      font-size: 11px;
      color: var(--gray-border);
      text-align: right;
      margin-top: 6px;
    }

    /* Result */
    .result {
      display: none;
      margin-top: 1.5rem;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--border);
    }

    .result-header {
      padding: 1rem 1.25rem 0.875rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: flex-start;
      gap: 10px;
    }

    .cat-icon {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      flex-shrink: 0;
    }

    .result-header-text {}

    .cat-badge {
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.06em;
      font-weight: 500;
      margin-bottom: 3px;
    }

    .cat-title {
      font-size: 15px;
      font-weight: 700;
      line-height: 1.3;
    }

    .result-body {
      padding: 1rem 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 0.875rem;
    }

    .result-section {}

    .result-section-label {
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.06em;
      color: var(--muted);
      margin-bottom: 4px;
    }

    .result-section-text {
      font-size: 14px;
      line-height: 1.8;
      color: var(--text);
    }

    /* Color variants */
    .v-green .result-header { background: var(--green-bg); }
    .v-green .cat-icon { background: var(--green-border); color: #fff; }
    .v-green .cat-badge { color: var(--green-text); }
    .v-green .cat-title { color: var(--green-text); }

    .v-amber .result-header { background: var(--amber-bg); }
    .v-amber .cat-icon { background: var(--amber-border); color: #fff; }
    .v-amber .cat-badge { color: var(--amber-text); }
    .v-amber .cat-title { color: var(--amber-text); }

    .v-red .result-header { background: var(--red-bg); }
    .v-red .cat-icon { background: var(--red-border); color: #fff; }
    .v-red .cat-badge { color: var(--red-text); }
    .v-red .cat-title { color: var(--red-text); }

    .v-gray .result-header { background: var(--gray-bg); }
    .v-gray .cat-icon { background: var(--gray-border); color: #fff; }
    .v-gray .cat-badge { color: var(--gray-text); }
    .v-gray .cat-title { color: var(--gray-text); }

    /* Spinner */
    .spinner {
      width: 16px; height: 16px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Legend */
    .legend {
      width: 100%;
      max-width: 560px;
      margin-top: 1.5rem;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.75rem;
    }

    .legend-item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
    }

    .legend-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      margin-bottom: 6px;
    }

    .legend-item-title {
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 2px;
      line-height: 1.3;
    }

    .legend-item-desc {
      font-size: 11px;
      color: var(--muted);
      line-height: 1.5;
    }

    .footer {
      margin-top: 3rem;
      font-size: 11px;
      color: var(--gray-border);
      text-align: center;
      line-height: 1.7;
    }

    @media (max-width: 480px) {
      .legend { grid-template-columns: 1fr; }
      .card { padding: 1.5rem 1.25rem; }
    }
  </style>
</head>
<body>

  <div class="header">
    <p class="header-label">文部科学省「学校と教師の業務の３分類」準拠</p>
    <h1>教師業務判定ツール</h1>
    <p class="header-sub">担当している業務を入力すると、教師が担うべき業務かどうかを判定します。</p>
  </div>

  <div class="card">
    <label class="input-label" for="taskInput">業務内容</label>
    <textarea id="taskInput" placeholder="例：保護者からの電話対応、部活動の土日引率、授業の教材作成..."></textarea>
    <p class="hint">Ctrl + Enter でも判定できます</p>
    <button class="btn" id="judgeBtn" onclick="judge()">判定する</button>

    <div class="result" id="result">
      <div class="result-header">
        <div class="cat-icon" id="resIcon"></div>
        <div class="result-header-text">
          <div class="cat-badge" id="resBadge"></div>
          <div class="cat-title" id="resTitle"></div>
        </div>
      </div>
      <div class="result-body">
        <div class="result-section">
          <div class="result-section-label">判定理由</div>
          <div class="result-section-text" id="resReason"></div>
        </div>
        <div class="result-section">
          <div class="result-section-label">アドバイス</div>
          <div class="result-section-text" id="resAdvice"></div>
        </div>
      </div>
    </div>
  </div>

  <div class="legend">
    <div class="legend-item">
      <div class="legend-dot" style="background: #97C459;"></div>
      <div class="legend-item-title" style="color: var(--green-text);">分類 A</div>
      <div class="legend-item-desc">教師が担うべき業務</div>
    </div>
    <div class="legend-item">
      <div class="legend-dot" style="background: #EF9F27;"></div>
      <div class="legend-item-title" style="color: var(--amber-text);">分類 B</div>
      <div class="legend-item-desc">担い方の検討が必要な業務</div>
    </div>
    <div class="legend-item">
      <div class="legend-dot" style="background: #D85A30;"></div>
      <div class="legend-item-title" style="color: var(--red-text);">分類 C</div>
      <div class="legend-item-desc">教師以外に委譲すべき業務</div>
    </div>
  </div>

  <p class="footer">
    本ツールは文部科学省の指針に基づく参考情報です。<br>
    最終判断は学校管理職とご相談ください。
  </p>

  <script>
    const CATEGORIES = {
      A: {
        variant: 'v-green',
        icon: '✓',
        badge: '分類 A — 教師の業務',
        title: '教師が担うべき業務です',
        reason: 'この業務は、学習指導・生徒指導・学校行事・学級経営など、教師が専門性をもって担うべき中核的な業務に該当します。',
        advice: '引き続き教師が主体的に取り組むべき業務です。ICT活用や校務の効率化で、授業の質向上に時間を充てましょう。',
        keywords: ['授業','学習指導','教材','板書','授業準備','教案','授業計画','生徒指導','学習評価','成績','テスト','試験','採点','通知表','指導要録','面談','進路指導','キャリア','学級経営','ホームルーム','LHR','道徳','学校行事','運動会','修学旅行','校外学習','遠足','入学','卒業','式典','特別活動','生徒会','不登校','特別支援','個別指導','カウンセリング','研修','校内研修','研究授業','教育計画','年間計画','課題','宿題','補習','学力向上','校務分掌','教育課程','指導計画','個人情報','緊急対応','安全指導','防災','避難訓練','いじめ','相談','保健','ケア']
      },
      B: {
        variant: 'v-amber',
        icon: '△',
        badge: '分類 B — 要検討業務',
        title: '担い方の見直しを検討してください',
        reason: 'この業務は教師が担っている場合もありますが、担い方や関与の程度について見直しや工夫の余地があるとされています。',
        advice: '部活動の地域移行、保護者・地域との役割分担、外部人材の活用など、他の担い手や方法を検討してみましょう。',
        keywords: ['立哨指導','勤務時間外','クレーム','部活動','クラブ','スポーツ指導','部活','朝礼','朝の会','終礼','帰りの会','給食指導','掃除指導','清掃','登下校指導','通学路','地域行事','地域連携','保護者対応','保護者会','PTA','会議','職員会議','委員会','学校だより','おたより','文書作成','印刷','事務','調査','アンケート','統計','報告書','集金','徴収','管理','施設','環境整備','消毒','見回り','校内巡視','事務処理','システム入力','データ入力','旅費']
      },
      C: {
        variant: 'v-red',
        icon: '×',
        badge: '分類 C — 委譲すべき業務',
        title: '教師以外が担うべき業務です',
        reason: 'この業務は、教師以外の専門スタッフや外部人材が担うことが適切とされています。文科省の指針では教師が担う必要のない業務として位置づけられています。',
        advice: '事務職員・補助員・外部委託・地域ボランティアなど、適切な担い手への移譲を学校管理職に相談してみましょう。',
        keywords: ['勤務時間外','調理','給食調理','食堂','校務員','施設管理','設備','修繕','清掃業務','警備','放課後','預かり','学童','スクールバス','バス管理','備品','用度','購買','売店','外部講師','補助員','事務職員','医療','健康診断','医師','歯科','嘱託','業者','外注','委託','ボランティア','地域人材','スクールカウンセラー','SC','SSW','ソーシャルワーカー','ICT支援','システム管理','サーバー','インフラ']
      }
    };

    function classify(text) {
      const t = text;
      let scores = { A: 0, B: 0, C: 0 };
      for (const [cat, info] of Object.entries(CATEGORIES)) {
        for (const kw of info.keywords) {
          if (t.includes(kw)) scores[cat]++;
        }
      }
      const max = Math.max(...Object.values(scores));
      if (max === 0) return null;
      return Object.entries(scores).find(([, v]) => v === max)[0];
    }

    function judge() {
      const input = document.getElementById('taskInput').value.trim();
      const resultEl = document.getElementById('result');
      const btn = document.getElementById('judgeBtn');
      if (!input) { resultEl.style.display = 'none'; return; }

      btn.disabled = true;
      btn.innerHTML = '<div class="spinner"></div>判定中...';
      resultEl.style.display = 'none';

      setTimeout(() => {
        const cat = classify(input);

        // Remove previous color variants
        resultEl.className = 'result';

        if (!cat) {
          resultEl.classList.add('v-gray');
          document.getElementById('resIcon').textContent = '?';
          document.getElementById('resBadge').textContent = '判定困難';
          document.getElementById('resTitle').textContent = 'より具体的な業務内容を入力してください';
          document.getElementById('resReason').textContent = '入力された内容だけでは分類が難しい状況です。';
          document.getElementById('resAdvice').textContent = '「部活動の土日練習引率」「授業の教材作成」のように、具体的な業務内容を記述してください。';
        } else {
          const info = CATEGORIES[cat];
          resultEl.classList.add(info.variant);
          document.getElementById('resIcon').textContent = info.icon;
          document.getElementById('resBadge').textContent = info.badge;
          document.getElementById('resTitle').textContent = info.title;
          document.getElementById('resReason').textContent = info.reason;
          document.getElementById('resAdvice').textContent = info.advice;
        }

        resultEl.style.display = 'block';
        btn.disabled = false;
        btn.innerHTML = '判定する';
      }, 500);
    }

    document.getElementById('taskInput').addEventListener('keydown', e => {
      if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) judge();
    });
  </script>
</body>
</html>
